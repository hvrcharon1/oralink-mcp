<svg viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg" width="680" height="160" role="img">
  <title>OraLink MCP</title>
  <desc>Oracle Autonomous Database MCP Connector for Claude.ai</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      .wm  { fill: #f5f5f4 !important; }
      .sub { fill: #fb923c !important; }
    }
  </style>
  <defs>
    <clipPath id="rb">
      <rect x="0" y="0" width="153" height="160"/>
    </clipPath>
    <clipPath id="rf">
      <rect x="153" y="0" width="527" height="160"/>
    </clipPath>
  </defs>

  <!-- right ring — back half (behind left ring) -->
  <g clip-path="url(#rb)">
    <circle cx="196" cy="80" r="44" fill="none" stroke="#c2410c" stroke-width="18"/>
  </g>

  <!-- left ring — full -->
  <circle cx="110" cy="80" r="44" fill="none" stroke="#f97316" stroke-width="18"/>

  <!-- right ring — front half -->
  <g clip-path="url(#rf)">
    <circle cx="196" cy="80" r="44" fill="none" stroke="#c2410c" stroke-width="18"/>
  </g>

  <!-- wordmark: presentational attrs carry full styling; class only for dark-mode override -->
  <text class="wm"
    x="272" y="97"
    fill="#18181b"
    font-size="62"
    font-weight="800"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    letter-spacing="-2">oralink</text>

  <text class="sub"
    x="275" y="127"
    fill="#f97316"
    font-size="19"
    font-weight="500"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    letter-spacing="4">mcp connector</text>
</svg>
